name: Keep Streamlit app awake

# 不使用 GitHub 的 `schedule` 排程：repo 超過 60 天沒有 commit 活動時，GitHub 會自動停用
# schedule 觸發且需要手動到 Actions 頁面重新 Enable，很容易悄悄失效而不自知。
# 改由外部排程服務（cron-job.org）每 6 小時呼叫 GitHub REST API 來觸發 workflow_dispatch，
# 不受那個 60 天自動停用規則影響。
on:
  workflow_dispatch: {}  # 也可以手動在 Actions 頁面點 "Run workflow"，或由外部排程服務（如 cron-job.org）呼叫 API 觸發

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit app to keep it awake
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: python scripts/keep_streamlit_awake.py
